{% extends "notification_master.html" %}

{% block extended_content %}
<style>
    .image-container {
      height: 300px;
      overflow: hidden;
      position: relative;
    }

    .movie-img {
      height: 100%;
      width: 100%;
      object-fit: contain;
      transition: transform 0.3s ease;
    }

    .image-container:hover .movie-img {
      transform: scale(1.1);
    }
</style>
<div class="container pt-2 pb-5 text-light">
    <div class="d-flex justify-content-between align-items-center mb-3">
      {% if is_user_admin %}
        <a href="{% url 'create_movie' %}" class="btn btn-danger">
          <i class="bi bi-plus-circle me-1"></i> ADD MOVIE
        </a>
      {% else %}
        <div></div>
      {% endif %}

      <form method="get" class="d-flex" role="search">
        <input class="form-control me-2" type="search" placeholder="Search movies..." name="search" value="{{ query|default:'' }}">
        <button class="btn btn-link text-white p-0 ps-1" type="submit" title="Search">
          <i class="bi bi-search fs-4"></i>
        </button>
      </form>
    </div>


    <h2 class="text-white mb-4">All Movies</h2>
    <div class="row">
    {% for movie in movies %}
      <div class="col-12 col-sm-6 col-md-4 col-lg-3 mb-4">
          <div class="card h-100 border-0 bg-black text-light overflow-hidden">
            <div class="image-container">
                <a href="{% url 'movie_display' movie.id %}">
                    <img src="{{ movie.photo.url }}" class="card-img-top movie-img" alt="{{ movie.title }}">
                </a>
            </div>
            <div class="card-body text-center">
              <h5 class="card-title mb-1">{{ movie.title }}</h5>
              <p style="color: #bfbaba;"><strong>Starting from: </strong>{{ movie.release_date|date:"d.m.Y" }}</p>
            </div>
          </div>
      </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
